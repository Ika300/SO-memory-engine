name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4
        with:
          path: SO_Memory_Engine

      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Ika300/so-memory-kernel
          path: SO_Memory_Kernel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kernel
        run: python -m pip install -e ../SO_Memory_Kernel
        working-directory: SO_Memory_Engine

      - name: Install Engine
        run: python -m pip install -e .
        working-directory: SO_Memory_Engine

      - name: Run tests
        run: python -m unittest discover -s tests -p '*test*.py' -v
        working-directory: SO_Memory_Engine

      - name: Run behavioral benchmarks
        run: python benchmarks/run_benchmarks.py
        working-directory: SO_Memory_Engine

      - name: Run comparative benchmarks
        run: python benchmarks/run_comparative_benchmarks.py
        working-directory: SO_Memory_Engine

      - name: Install bundled Extractor Free
        run: python -m pip install -e SO_Extractor_Free
        working-directory: SO_Memory_Engine

      - name: Run complete free quickstart
        run: python quickstart.py
        working-directory: SO_Memory_Engine

      - name: Run bundled Extractor Free tests
        run: python -m unittest discover -s SO_Extractor_Free/tests -p '*test*.py' -v
        working-directory: SO_Memory_Engine

      - name: Run bundled Extractor Free demos
        run: |
          python SO_Extractor_Free/examples/conversation_log_demo.py
          python SO_Extractor_Free/examples/chatgpt_export_like_demo.py
          python SO_Extractor_Free/examples/end_to_end_engine_demo.py
        working-directory: SO_Memory_Engine
