[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so-memory-engine"
version = "0.1.0"
description = "Structural memory context for AI applications, built on SO Memory Kernel."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ika300" }
]
keywords = [
    "ai-memory",
    "memory-engine",
    "structural-memory",
    "context-pack",
    "agent-memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ika300/SO-memory-engine"
Kernel = "https://github.com/Ika300/so-memory-kernel"

[tool.setuptools.packages.find]
include = ["so_memory_engine*"]
